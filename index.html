<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRIEND VOTE 2026</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#74c9f5,#238fd0,#0864ad);
  color:white;
  min-height:100vh;
}

.page{
  width:94%;
  max-width:720px;
  margin:auto;
  padding-bottom:40px;
}

/* HEADER */

.header{
  text-align:center;
  padding:28px 10px 20px;
}

.header h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:36px;
  letter-spacing:3px;
  text-shadow:0 3px 8px rgba(0,0,0,.25);
}

.header p{
  margin:8px 0 0;
  font-size:10px;
  letter-spacing:3px;
}

/* INFO */

.info{
  background:rgba(0,55,100,.35);
  border:1px solid rgba(255,255,255,.25);
  border-radius:15px;
  padding:13px;
  text-align:center;
  margin-bottom:18px;
  font-size:13px;
}

/* COMMON CARD */

.card{
  background:#06151f;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.28);
}

/* TOP 1 */

.top-card{
  margin-bottom:18px;
}

.top-photo{
  width:100%;
  height:420px;
  display:block;
  object-fit:cover;
  background:#12384e;
}

.top-info{
  position:relative;
  padding:18px;
}

.top-city{
  font-size:25px;
  font-weight:bold;
  text-align:left;
}

.top-name{
  font-family:Georgia,"Times New Roman",serif;
  font-size:23px;
  font-weight:bold;
  text-align:center;
  margin-top:12px;
}

.top-rank{
  position:absolute;
  right:18px;
  top:14px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#155579;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  font-size:38px;
  font-weight:bold;
}

.actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-top:18px;
}

.vote{
  border:0;
  background:white;
  color:#146293;
  font-weight:bold;
  border-radius:30px;
  padding:13px 35px;
  font-size:17px;
  cursor:pointer;
}

.points{
  font-size:17px;
  font-weight:bold;
}

/* OTHER CONTESTANTS */

.contestant{
  display:flex;
  background:#06151f;
  border-radius:17px;
  overflow:hidden;
  margin:13px 0;
  min-height:175px;
  box-shadow:0 7px 20px rgba(0,0,0,.25);
}

.contestant-photo{
  width:175px;
  min-width:175px;
  height:175px;
  object-fit:cover;
  display:block;
  background:#12384e;
}

.contestant-info{
  flex:1;
  padding:22px 10px 15px 17px;
  min-width:0;
}

.city{
  font-size:19px;
  font-weight:bold;
  line-height:1.2;
}

.name{
  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  font-weight:bold;
  margin-top:14px;
}

.small-actions{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:22px;
}

.small-vote{
  border:0;
  background:white;
  color:#146293;
  font-weight:bold;
  border-radius:25px;
  padding:10px 23px;
  cursor:pointer;
}

.small-points{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.rank{
  width:55px;
  min-width:55px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Georgia,serif;
  font-size:34px;
  font-weight:bold;
}

/* BOTTOM */

.bottom{
  background:rgba(0,55,100,.35);
  border-radius:15px;
  text-align:center;
  padding:18px;
  margin-top:23px;
  line-height:1.7;
}

.footer{
  text-align:center;
  padding:28px 0 10px;
}

.footer h2{
  margin:0;
  font-family:Georgia,serif;
  font-size:22px;
}

/* ADMIN LOCK */

.admin-lock{
  text-align:center;
  margin-top:15px;
}

.lock{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,45,80,.35);
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* ADMIN */

.admin-panel{
  display:none;
  margin-top:15px;
  background:white;
  color:#164c70;
  border-radius:18px;
  padding:18px;
}

.admin-title{
  text-align:center;
  font-size:21px;
  font-weight:bold;
  margin-bottom:15px;
}

.pin-row{
  display:flex;
  gap:8px;
}

.input{
  width:100%;
  padding:11px;
  margin:5px 0;
  border:1px solid #b8d7e8;
  border-radius:9px;
  outline:none;
}

.pin-row .input{
  flex:1;
}

.admin-btn{
  border:0;
  background:#147fbd;
  color:white;
  padding:11px 16px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.editor{
  display:none;
  margin-top:18px;
}

.admin-card{
  background:#eef9ff;
  border:1px solid #c7e4f3;
  border-radius:14px;
  padding:14px;
  margin:12px 0;
}

.admin-card-title{
  font-weight:bold;
  font-size:16px;
  margin-bottom:10px;
}

.admin-image{
  width:85px;
  height:85px;
  border-radius:10px;
  object-fit:cover;
  background:#b9dff2;
  display:block;
  margin-bottom:10px;
}

.file-label{
  display:block;
  padding:11px;
  border:2px dashed #7db9d8;
  border-radius:9px;
  text-align:center;
  color:#16709d;
  background:#e5f6ff;
  cursor:pointer;
  margin:7px 0;
}

.file-label input{
  display:none;
}

.admin-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:8px;
}

.delete{
  background:#d94b4b;
}

.new-contestant{
  background:#e8f8ff;
  border:2px solid #a6d9ef;
  border-radius:14px;
  padding:15px;
  margin-top:20px;
}

.new-title{
  font-weight:bold;
  font-size:18px;
  margin-bottom:10px;
  color:#075b8d;
}

.new-preview{
  width:100px;
  height:100px;
  border-radius:10px;
  object-fit:cover;
  display:none;
  margin:8px 0;
}

/* MOBILE */

@media(max-width:600px){

  .header h1{
    font-size:29px;
  }

  .top-photo{
    height:390px;
  }

  .top-city{
    font-size:22px;
  }

  .top-name{
    font-size:20px;
  }

  .contestant{
    min-height:155px;
  }

  .contestant-photo{
    width:120px;
    min-width:120px;
    height:155px;
  }

  .contestant-info{
    padding:18px 5px 10px 13px;
  }

  .city{
    font-size:16px;
  }

  .name{
    font-size:14px;
    margin-top:12px;
  }

  .small-actions{
    margin-top:18px;
    gap:7px;
  }

  .small-vote{
    padding:9px 17px;
    font-size:12px;
  }

  .small-points{
    font-size:12px;
  }

  .rank{
    width:38px;
    min-width:38px;
    font-size:28px;
  }

}
</style>
</head>


<body>

<div class="page">

  <!-- HEADER -->

  <div class="header">

    <h1>FRIEND VOTE 2026</h1>

    <p>
      INTERNATIONAL FRIENDSHIP VOTING
    </p>

  </div>


  <!-- INFO -->

  <div class="info">

    <strong>1 VOTE = 10 POINTS</strong>

    <br>

    Highest Points will become TOP 1

  </div>


  <!-- TOP 1 -->

  <div id="topOne"></div>


  <!-- OTHER CONTESTANTS -->

  <div id="contestants"></div>


  <!-- BOTTOM -->

  <div class="bottom">

    Vote for your favourite friend

    <br>

    Every vote counts

  </div>


  <div class="footer">

    <h2>Vote Your Favourite Friend</h2>

  </div>


  <!-- ADMIN LOCK -->

  <div class="admin-lock">

    <button
      class="lock"
      onclick="openAdmin()">

      🔒

    </button>

  </div>


  <!-- ADMIN PANEL -->

  <div
    class="admin-panel"
    id="adminPanel">

    <div class="admin-title">
      ADMIN PERMITS
    </div>


    <!-- PIN -->

    <div class="pin-row">

      <input
        class="input"
        type="password"
        id="pin"
        placeholder="Admin PIN">

      <button
        class="admin-btn"
        onclick="loginAdmin()">

        Login

      </button>

    </div>


    <!-- EDITOR -->

    <div
      class="editor"
      id="editor">

      <hr>

      <div class="admin-title">
        CONTESTANT MANAGEMENT
      </div>


      <div id="adminList"></div>


      <!-- NEW CONTESTANT -->

      <div class="new-contestant">

        <div class="new-title">
          ＋ NEW CONTESTANT
        </div>


        <input
          class="input"
          id="newCity"
          type="text"
          placeholder="City Name">


        <input
          class="input"
          id="newName"
          type="text"
          placeholder="Contestant Name">


        <input
          class="input"
          id="newPoints"
          type="number"
          value="0"
          placeholder="Points">


        <label class="file-label">

          📷 Choose Photo

          <input
            type="file"
            id="newPhoto"
            accept="image/*"
            onchange="newPhotoPreview(event)">

        </label>


        <img
          id="newPreview"
          class="new-preview">


        <button
          class="admin-btn"
          onclick="addContestant()">

          ＋ Add New Contestant

        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   DEFAULT DATA
========================= */

const defaultContestants = [

  {
    city:"SPAIN",
    name:"Contestant 1",
    photo:"",
    points:0
  },

  {
    city:"SOUTH AFRICA",
    name:"Contestant 2",
    photo:"",
    points:0
  },

  {
    city:"MYANMAR",
    name:"Contestant 3",
    photo:"",
    points:0
  },

  {
    city:"THAILAND",
    name:"Contestant 4",
    photo:"",
    points:0
  },

  {
    city:"PHILIPPINES",
    name:"Contestant 5",
    photo:"",
    points:0
  },

  {
    city:"INDONESIA",
    name:"Contestant 6",
    photo:"",
    points:0
  }

];


/* =========================
   LOAD DATA
========================= */

let saved =
  localStorage.getItem("friendVote2026");

let contestants =
  saved
  ? JSON.parse(saved)
  : defaultContestants;


/* =========================
   SAVE
========================= */

function saveData(){

  localStorage.setItem(
    "friendVote2026",
    JSON.stringify(contestants)
  );

}


/* =========================
   IMAGE
========================= */

function imageHTML(photo,name,className){

  if(photo && photo.trim() !== ""){

    return `
      <img
        class="${className}"
        src="${photo}"
        alt="${escapeHTML(name)}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
      >

      <div
        style="
          display:none;
          width:100%;
          height:100%;
          min-height:100px;
          align-items:center;
          justify-content:center;
          background:#12384e;
          font-size:40px;
          font-family:Georgia,serif;
        ">

        ${escapeHTML(name.charAt(0).toUpperCase())}

      </div>
    `;

  }


  return `

    <div
      class="${className}"
      style="
        display:flex;
        align-items:center;
        justify-content:center;
        background:#12384e;
        font-size:45px;
        font-family:Georgia,serif;
      ">

      ${escapeHTML(name.charAt(0).toUpperCase())}

    </div>

  `;

}


/* =========================
   DISPLAY
========================= */

function displayContestants(){

  contestants.sort(
    (a,b) =>
      Number(b.points || 0) -
      Number(a.points || 0)
  );


  saveData();


  const topBox =
    document.getElementById("topOne");

  const listBox =
    document.getElementById("contestants");


  if(contestants.length === 0){

    topBox.innerHTML="";
    listBox.innerHTML="";

    return;

  }


  /* TOP 1 */

  const top =
    contestants[0];


  topBox.innerHTML = `

    <div class="card top-card">

      ${imageHTML(
        top.photo,
        top.name,
        "top-photo"
      )}

      <div class="top-info">

        <div class="top-city">
          ${escapeHTML(top.city)}
        </div>

        <div class="top-name">
          ${escapeHTML(top.name)}
        </div>

        <div class="top-rank">
          1
        </div>

        <div class="actions">

          <button
            class="vote"
            onclick="vote(0)">

            VOTE

          </button>

          <div class="points">

            ${Number(top.points || 0)} Ⓟ

          </div>

        </div>

      </div>

    </div>

  `;


  /* OTHER */

  listBox.innerHTML="";


  for(
    let i=1;
    i<contestants.length;
    i++
  ){

    const person =
      contestants[i];


    listBox.innerHTML += `

      <div class="contestant">

        ${imageHTML(
          person.photo,
          person.name,
          "contestant-photo"
        )}

        <div class="contestant-info">

          <div class="city">
            ${escapeHTML(person.city)}
          </div>

          <div class="name">
            ${escapeHTML(person.name)}
          </div>

          <div class="small-actions">

            <button
              class="small-vote"
              onclick="vote(${i})">

              VOTE

            </button>

            <div class="small-points">

              ${Number(person.points || 0)} Ⓟ

            </div>

          </div>

        </div>

        <div class="rank">
          ${i+1}
        </div>

      </div>

    `;

  }

}


/* =========================
   VOTE
========================= */

function vote(index){

  contestants[index].points =
    Number(contestants[index].points || 0) + 10;


  saveData();

  displayContestants();


  if(
    document.getElementById("editor").style.display === "block"
  ){

    renderAdmin();

  }

}


/* =========================
   ADMIN OPEN
========================= */

function openAdmin(){

  const panel =
    document.getElementById("adminPanel");


  if(panel.style.display === "block"){

    panel.style.display="none";

  }else{

    panel.style.display="block";

  }

}


/* =========================
   ADMIN LOGIN
========================= */

function loginAdmin(){

  const pin =
    document.getElementById("pin").value;


  if(pin === "2013"){

    document.getElementById(
      "editor"
    ).style.display="block";


    renderAdmin();

  }else{

    alert("Incorrect PIN");

  }

}


/* =========================
   ADMIN LIST
========================= */

function renderAdmin(){

  const box =
    document.getElementById("adminList");


  box.innerHTML="";


  contestants.forEach(
    function(person,index){

      box.innerHTML += `

        <div class="admin-card">

          <div class="admin-card-title">

            Contestant ${index+1}

          </div>


          <img
            id="adminImage${index}"
            class="admin-image"
            src="${person.photo || ""}"
            style="${person.photo ? "" : "display:none;"}"
          >


          <label class="file-label">

            📷 Change Contestant Photo

            <input
              type="file"
              accept="image/*"
              onchange="changePhoto(event,${index})">

          </label>


          <input
            class="input"
            id="city${index}"
            type="text"
            value="${escapeHTML(person.city)}"
            placeholder="City Name">


          <input
            class="input"
            id="name${index}"
            type="text"
            value="${escapeHTML(person.name)}"
            placeholder="Contestant Name">


          <input
            class="input"
            id="points${index}"
            type="number"
            value="${Number(person.points || 0)}"
            placeholder="Points">


          <div class="admin-buttons">

            <button
              class="admin-btn"
              onclick="saveContestant(${index})">

              Save Changes

            </button>


            <button
              class="admin-btn delete"
              onclick="deleteContestant(${index})">

              Delete

            </button>

          </div>

        </div>

      `;

    }
  );

}


/* =========================
   CHANGE PHOTO
========================= */

function changePhoto(event,index){

  const file =
    event.target.files[0];


  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      contestants[index].photo =
        e.target.result;


      const img =
        document.getElementById(
          "adminImage"+index
        );


      img.src =
        e.target.result;

      img.style.display="block";


      saveData();


      displayContestants();

    };


  reader.readAsDataURL(file);

}


/* =========================
   SAVE CONTESTANT
========================= */

function saveContestant(index){

  const city =
    document.getElementById(
      "city"+index
    ).value.trim();


  const name =
    document.getElementById(
      "name"+index
    ).value.trim();


  const points =
    document.getElementById(
      "points"+index
    ).value;


  if(city !== ""){

    contestants[index].city =
      city;

  }


  if(name !== ""){

    contestants[index].name =
      name;

  }


  if(points !== ""){

    contestants[index].points =
      Number(points);

  }


  saveData();

  displayContestants();

  renderAdmin();


  alert(
    "Contestant updated successfully!"
  );

}


/* =========================
   DELETE
========================= */

function deleteContestant(index){

  if(contestants.length <= 1){

    alert(
      "You need at least one contestant."
    );

    return;

  }


  if(
    !confirm(
      "Delete Contestant " +
      (index+1) +
      "?"
    )
  ){

    return;

  }


  contestants.splice(index,1);


  saveData();

  displayContestants();

  renderAdmin();

}


/* =========================
   NEW PHOTO
========================= */

let newPhotoData="";


function newPhotoPreview(event){

  const file =
    event.target.files[0];


  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      newPhotoData =
        e.target.result;


      const preview =
        document.getElementById(
          "newPreview"
        );


      preview.src =
        newPhotoData;

      preview.style.display="block";

    };


  reader.readAsDataURL(file);

}


/* =========================
   ADD NEW CONTESTANT
========================= */

function addContestant(){

  const city =
    document.getElementById(
      "newCity"
    ).value.trim();


  const name =
    document.getElementById(
      "newName"
    ).value.trim();


  const points =
    document.getElementById(
      "newPoints"
    ).value;


  if(city === ""){

    alert("Please enter City Name.");

    return;

  }


  if(name === ""){

    alert("Please enter Contestant Name.");

    return;

  }


  contestants.push({

    city:city,

    name:name,

    photo:newPhotoData,

    points:
      points === ""
      ? 0
      : Number(points)

  });


  saveData();

  displayContestants();

  renderAdmin();


  document.getElementById(
    "newCity"
  ).value="";


  document.getElementById(
    "newName"
  ).value="";


  document.getElementById(
    "newPoints"
  ).value="0";


  document.getElementById(
    "newPhoto"
  ).value="";


  document.getElementById(
    "newPreview"
  ).style.display="none";


  newPhotoData="";


  alert(
    "New Contestant added successfully!"
  );

}


/* =========================
   ESCAPE TEXT
========================= */

function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

displayContestants();

</script>

</body>
</html>
