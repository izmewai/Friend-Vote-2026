<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Vote 2026</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    linear-gradient(180deg,#5bb9e8 0%,#258bd0 48%,#075aa5 100%);
  min-height:100vh;
}

.page{
  width:94%;
  max-width:760px;
  margin:auto;
  padding-bottom:40px;
}

/* HEADER */

.header{
  text-align:center;
  padding:30px 10px 20px;
}

.header h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:38px;
  letter-spacing:3px;
  text-shadow:0 3px 8px rgba(0,0,0,.3);
}

.header p{
  margin:8px 0 0;
  font-size:11px;
  letter-spacing:3px;
  opacity:.9;
}

/* INFO */

.info{
  background:rgba(0,50,100,.32);
  border:1px solid rgba(255,255,255,.25);
  border-radius:15px;
  padding:14px;
  text-align:center;
  margin-bottom:20px;
  font-size:13px;
}

/* TOP 1 */

.top-card{
  background:#06121b;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.top-photo{
  width:100%;
  height:430px;
  object-fit:cover;
  display:block;
}

.top-content{
  position:relative;
  padding:18px;
}

.top-city{
  font-size:25px;
  font-weight:bold;
}

.orange-line,
.list-line{
  width:105px;
  height:9px;
  background:#ff7048;
  border-radius:50%;
  transform:rotate(4deg);
  margin:12px 0;
}

.top-name{
  font-family:Georgia,serif;
  text-align:center;
  font-size:23px;
  font-weight:bold;
}

.top-rank{
  position:absolute;
  right:18px;
  top:15px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#17445e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  font-size:38px;
  font-weight:bold;
}

.top-actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-top:18px;
}

.vote-btn,
.small-vote{
  border:0;
  background:#fff;
  color:#12609a;
  font-weight:bold;
  cursor:pointer;
  border-radius:30px;
}

.vote-btn{
  min-width:190px;
  padding:13px 30px;
  font-size:17px;
}

.points{
  font-weight:bold;
  font-size:17px;
}

/* LIST */

.list-card{
  display:flex;
  align-items:stretch;
  background:#06121b;
  border-radius:17px;
  overflow:hidden;
  margin:13px 0;
  min-height:180px;
  box-shadow:0 7px 20px rgba(0,0,0,.25);
}

.list-photo{
  width:180px;
  min-width:180px;
  height:180px;
  object-fit:cover;
}

.list-content{
  flex:1;
  padding:22px 14px 15px 18px;
}

.list-city{
  font-size:19px;
  font-weight:bold;
}

.list-name{
  font-family:Georgia,serif;
  font-size:15px;
  font-weight:bold;
  margin-bottom:18px;
}

.list-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.small-vote{
  padding:10px 24px;
  font-size:14px;
}

.small-points{
  font-size:14px;
  font-weight:bold;
}

.rank{
  width:55px;
  min-width:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  font-size:32px;
  font-weight:bold;
}

/* BOTTOM */

.bottom-box{
  margin-top:25px;
  padding:20px;
  border-radius:15px;
  text-align:center;
  background:rgba(0,55,105,.38);
  font-size:15px;
  line-height:1.7;
}

.footer{
  text-align:center;
  padding:30px 0 10px;
}

.footer h2{
  margin:0;
  font-family:Georgia,serif;
  font-size:23px;
}

/* ADMIN */

.admin-lock{
  text-align:center;
  margin-top:15px;
}

.lock-btn{
  border:0;
  background:rgba(0,40,80,.3);
  color:white;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.admin-panel{
  display:none;
  margin-top:15px;
  background:#fff;
  color:#164b72;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.admin-title{
  text-align:center;
  font-size:21px;
  font-weight:bold;
  margin-bottom:15px;
}

.pin-box{
  display:flex;
  gap:8px;
}

.pin-box input{
  flex:1;
}

.admin-input{
  width:100%;
  padding:11px;
  margin:5px 0;
  border:1px solid #b9d7e8;
  border-radius:9px;
  outline:none;
}

.admin-input:focus{
  border-color:#168dd0;
}

.admin-btn{
  border:0;
  background:#147fc0;
  color:white;
  padding:11px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.admin-btn.red{
  background:#dc4b4b;
}

.admin-btn.green{
  background:#159b69;
}

.editor{
  display:none;
  margin-top:20px;
}

.admin-card{
  background:#edf8ff;
  border:1px solid #c7e4f4;
  border-radius:14px;
  padding:14px;
  margin:12px 0;
}

.admin-card-title{
  font-weight:bold;
  margin-bottom:10px;
  color:#075b91;
}

.admin-photo{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
  display:block;
  margin-bottom:10px;
}

.file-label{
  display:block;
  background:#dff2ff;
  border:2px dashed #79bde2;
  color:#126796;
  text-align:center;
  padding:11px;
  border-radius:9px;
  cursor:pointer;
  margin:7px 0;
}

.file-label input{
  display:none;
}

.new-box{
  background:#e8f8ff;
  border:2px solid #9ed5ef;
  border-radius:15px;
  padding:15px;
  margin-top:20px;
}

.new-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
  color:#075b91;
}

.preview{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
  display:none;
  margin:8px 0;
}

.admin-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

/* MOBILE */

@media(max-width:600px){

  .header h1{
    font-size:29px;
  }

  .top-photo{
    height:390px;
  }

  .list-card{
    min-height:155px;
  }

  .list-photo{
    width:120px;
    min-width:120px;
    height:155px;
  }

  .list-content{
    padding:18px 7px 10px 13px;
  }

  .list-city{
    font-size:16px;
  }

  .list-name{
    font-size:13px;
    margin-bottom:13px;
  }

  .small-vote{
    padding:9px 17px;
    font-size:12px;
  }

  .small-points{
    font-size:12px;
  }

  .rank{
    width:38px;
    min-width:38px;
    font-size:27px;
  }

  .top-actions{
    gap:9px;
  }

  .vote-btn{
    min-width:150px;
  }

}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop preload="auto">
  <source src="VID_20260908_211144_780.mp4" type="video/mp4">
</audio>


<div class="page">

  <div class="header">
    <h1>FRIEND VOTE 2026</h1>
    <p>INTERNATIONAL FRIENDSHIP VOTING</p>
  </div>


  <div class="info">
    <strong>1 VOTE = 10 POINTS</strong><br>
    Highest Points will become TOP 1
  </div>


  <!-- TOP 1 -->
  <div id="topOne"></div>


  <!-- CONTESTANTS -->
  <div id="contestants"></div>


  <div class="bottom-box">
    Vote for your favourite friend
    <br>
    Every vote counts
  </div>


  <div class="footer">
    <h2>Vote Your Favourite Friend</h2>
  </div>


  <!-- ADMIN LOCK -->
  <div class="admin-lock">
    <button class="lock-btn" onclick="openAdmin()">🔒</button>
  </div>


  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="adminPanel">

    <div class="admin-title">
      ADMIN PERMITS
    </div>

    <!-- PIN -->
    <div class="pin-box">

      <input
        class="admin-input"
        type="password"
        id="pin"
        placeholder="Enter Admin PIN">

      <button
        class="admin-btn"
        onclick="loginAdmin()">
        Login
      </button>

    </div>


    <!-- EDITOR -->
    <div class="editor" id="editor">

      <hr>

      <div class="admin-title">
        Contestant Management
      </div>

      <div id="adminList"></div>


      <!-- NEW CONTESTANT -->

      <div class="new-box">

        <div class="new-title">
          ＋ NEW CONTESTANT
        </div>

        <input
          class="admin-input"
          type="text"
          id="newCity"
          placeholder="City Name">

        <input
          class="admin-input"
          type="text"
          id="newName"
          placeholder="Contestant Name">

        <input
          class="admin-input"
          type="number"
          id="newPoints"
          placeholder="Starting Points"
          value="0">

        <label class="file-label">

          📷 Choose Contestant Photo

          <input
            type="file"
            id="newPhoto"
            accept="image/*"
            onchange="previewNewPhoto(event)">

        </label>

        <img
          id="newPreview"
          class="preview">

        <button
          class="admin-btn green"
          onclick="addContestant()">
          ＋ Add Contestant
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   DEFAULT CONTESTANTS
========================= */

let defaultContestants = [

  {
    city:"SPAIN",
    name:"Contestant 1",
    photo:"friend1.jpg",
    points:0
  },

  {
    city:"SOUTH AFRICA",
    name:"Contestant 2",
    photo:"friend2.jpg",
    points:0
  },

  {
    city:"MYANMAR",
    name:"Contestant 3",
    photo:"friend3.jpg",
    points:0
  },

  {
    city:"THAILAND",
    name:"Contestant 4",
    photo:"friend4.jpg",
    points:0
  },

  {
    city:"PHILIPPINES",
    name:"Contestant 5",
    photo:"friend5.jpg",
    points:0
  },

  {
    city:"INDONESIA",
    name:"Contestant 6",
    photo:"friend6.jpg",
    points:0
  }

];


let saved =
  localStorage.getItem("friendVote2026");

let contestants =
  saved
  ? JSON.parse(saved)
  : defaultContestants;


/* =========================
   SAVE
========================= */

function saveData(){

  localStorage.setItem(
    "friendVote2026",
    JSON.stringify(contestants)
  );

}


/* =========================
   DISPLAY
========================= */

function displayContestants(){

  contestants.sort(function(a,b){
    return Number(b.points) - Number(a.points);
  });

  saveData();

  let topBox =
    document.getElementById("topOne");

  let listBox =
    document.getElementById("contestants");


  if(contestants.length === 0){

    topBox.innerHTML="";
    listBox.innerHTML="";

    return;
  }


  /* TOP 1 */

  let top = contestants[0];

  topBox.innerHTML = `

    <div class="top-card">

      <img
        class="top-photo"
        src="${top.photo}"
        alt="${top.name}">

      <div class="top-content">

        <div class="top-city">
          ${top.city}
        </div>

        <div class="orange-line"></div>

        <div class="top-name">
          ${top.name}
        </div>

        <div class="top-rank">
          1
        </div>

        <div class="top-actions">

          <button
            class="vote-btn"
            onclick="vote(0)">
            VOTE
          </button>

          <div class="points">
            ${top.points} Ⓟ
          </div>

        </div>

      </div>

    </div>

  `;


  /* OTHER */

  listBox.innerHTML="";


  for(let i=1;i<contestants.length;i++){

    let person = contestants[i];

    listBox.innerHTML += `

      <div class="list-card">

        <img
          class="list-photo"
          src="${person.photo}"
          alt="${person.name}">

        <div class="list-content">

          <div class="list-city">
            ${person.city}
          </div>

          <div class="list-line"></div>

          <div class="list-name">
            ${person.name}
          </div>

          <div class="list-actions">

            <button
              class="small-vote"
              onclick="vote(${i})">
              VOTE
            </button>

            <div class="small-points">
              ${person.points} Ⓟ
            </div>

          </div>

        </div>

        <div class="rank">
          ${i+1}
        </div>

      </div>

    `;

  }

}


/* =========================
   VOTE
========================= */

function vote(index){

  contestants[index].points =
    Number(contestants[index].points) + 10;

  saveData();

  displayContestants();

  if(
    document.getElementById("editor").style.display === "block"
  ){
    renderAdmin();
  }

}


/* =========================
   ADMIN OPEN
========================= */

function openAdmin(){

  let panel =
    document.getElementById("adminPanel");

  if(panel.style.display === "block"){

    panel.style.display="none";

  }else{

    panel.style.display="block";

  }

}


/* =========================
   ADMIN LOGIN
========================= */

function loginAdmin(){

  let pin =
    document.getElementById("pin").value;

  if(pin === "2013"){

    document.getElementById(
      "editor"
    ).style.display="block";

    renderAdmin();

  }else{

    alert("Incorrect PIN");

  }

}


/* =========================
   ADMIN LIST
========================= */

function renderAdmin(){

  let box =
    document.getElementById("adminList");

  box.innerHTML="";


  contestants.forEach(function(person,index){

    box.innerHTML += `

      <div class="admin-card">

        <div class="admin-card-title">
          Contestant ${index+1}
        </div>

        <img
          class="admin-photo"
          id="adminPreview${index}"
          src="${person.photo}">


        <label class="file-label">

          📷 Change Photo

          <input
            type="file"
            accept="image/*"
            onchange="changePhoto(event,${index})">

        </label>


        <input
          class="admin-input"
          type="text"
          id="city${index}"
          value="${escapeHtml(person.city)}"
          placeholder="City Name">


        <input
          class="admin-input"
          type="text"
          id="name${index}"
          value="${escapeHtml(person.name)}"
          placeholder="Contestant Name">


        <input
          class="admin-input"
          type="number"
          id="points${index}"
          value="${person.points}"
          placeholder="Points">


        <div class="admin-actions">

          <button
            class="admin-btn"
            onclick="saveContestant(${index})">
            Save Changes
          </button>

          <button
            class="admin-btn red"
            onclick="deleteContestant(${index})">
            Delete
          </button>

        </div>

      </div>

    `;

  });

}


/* =========================
   CHANGE PHOTO
========================= */

function changePhoto(event,index){

  let file =
    event.target.files[0];

  if(!file){
    return;
  }

  let reader =
    new FileReader();

  reader.onload=function(e){

    contestants[index].photo =
      e.target.result;

    document.getElementById(
      "adminPreview"+index
    ).src=e.target.result;

    saveData();

  };

  reader.readAsDataURL(file);

}


/* =========================
   SAVE CONTESTANT
========================= */

function saveContestant(index){

  let city =
    document.getElementById(
      "city"+index
    ).value.trim();

  let name =
    document.getElementById(
      "name"+index
    ).value.trim();

  let points =
    document.getElementById(
      "points"+index
    ).value;


  if(city !== ""){
    contestants[index].city=city;
  }

  if(name !== ""){
    contestants[index].name=name;
  }

  if(points !== ""){
    contestants[index].points=
      Number(points);
  }


  saveData();

  displayContestants();

  renderAdmin();

  alert("Contestant saved!");

}


/* =========================
   DELETE
========================= */

function deleteContestant(index){

  if(contestants.length <= 1){

    alert("At least 1 contestant is required.");

    return;

  }


  let confirmDelete =
    confirm(
      "Delete this contestant?"
    );

  if(!confirmDelete){
    return;
  }


  contestants.splice(index,1);

  saveData();

  displayContestants();

  renderAdmin();

}


/* =========================
   NEW CONTESTANT PHOTO
========================= */

let newPhotoData="";


function previewNewPhoto(event){

  let file =
    event.target.files[0];

  if(!file){
    return;
  }

  let reader =
    new FileReader();

  reader.onload=function(e){

    newPhotoData =
      e.target.result;

    let preview =
      document.getElementById(
        "newPreview"
      );

    preview.src =
      newPhotoData;

    preview.style.display="block";

  };

  reader.readAsDataURL(file);

}


/* =========================
   ADD NEW CONTESTANT
========================= */

function addContestant(){

  let city =
    document.getElementById(
      "newCity"
    ).value.trim();

  let name =
    document.getElementById(
      "newName"
    ).value.trim();

  let points =
    document.getElementById(
      "newPoints"
    ).value;


  if(city === "" || name === ""){

    alert(
      "Please enter City and Contestant Name."
    );

    return;

  }


  contestants.push({

    city:city,

    name:name,

    photo:
      newPhotoData ||
      "friend1.jpg",

    points:
      points === ""
      ? 0
      : Number(points)

  });


  saveData();

  displayContestants();

  renderAdmin();


  /* CLEAR */

  document.getElementById(
    "newCity"
  ).value="";

  document.getElementById(
    "newName"
  ).value="";

  document.getElementById(
    "newPoints"
  ).value="0";

  document.getElementById(
    "newPhoto"
  ).value="";

  document.getElementById(
    "newPreview"
  ).style.display="none";

  newPhotoData="";


  alert(
    "New Contestant added successfully!"
  );

}


/* =========================
   SAFE TEXT
========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   MUSIC
========================= */

let music =
  document.getElementById("music");


window.addEventListener(
  "load",
  function(){

    music.play().catch(
      function(){}
    );

  }
);


document.addEventListener(
  "click",
  function(){

    if(music.paused){

      music.play().catch(
        function(){}
      );

    }

  },
  {once:true}
);


/* =========================
   START
========================= */

displayContestants();

</script>

</body>
</html>
